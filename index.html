<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Happy Birthday, Ami ♡</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Poppins:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff0f5;
        --pink: #f8c8dc;
        --soft: #fadadd;
        --acc: #e8a0bf;
        --ink: #70465a;
        --gold: #d8b878;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(
          circle at 50% 0,
          #fff 0,
          var(--bg) 55%,
          var(--soft) 100%
        );
        background-attachment: fixed;
        color: var(--ink);
        font:
          300 15px/1.6 Poppins,
          sans-serif;
        overflow-x: hidden;
      }
      h1,
      h2,
      h3 {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        margin: 0;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
      }
      #view {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        transition:
          opacity 0.35s,
          transform 0.35s;
      }
      #view.out {
        opacity: 0;
        transform: translateY(10px);
      }
      .screen {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 18px 40px;
        text-align: center;
      }
      .bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .bg i {
        position: absolute;
        bottom: -30px;
        color: var(--acc);
        opacity: 0;
        animation: rise linear infinite;
        font-style: normal;
      }
      @keyframes rise {
        10% {
          opacity: 0.5;
        }
        100% {
          transform: translateY(-110vh) rotate(25deg);
          opacity: 0;
        }
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--acc);
      }
      .btn {
        background: #fff;
        border: 1px solid var(--pink);
        border-radius: 999px;
        padding: 10px 20px;
        box-shadow: 0 4px 14px #e8a0bf33;
        transition: 0.25s;
      }
      .btn:hover {
        transform: translateY(-2px);
        background: var(--pink);
      }
      .btn:disabled {
        opacity: 0.4;
        pointer-events: none;
      }
      .btn.big {
        padding: 16px 34px;
        font-size: 17px;
        background: linear-gradient(#fff, var(--soft));
      }
      /* cake */
      #cake {
        position: relative;
        width: min(300px, 78vw);
        margin: 18px auto 0;
      }
      #cake svg {
        width: 100%;
        display: block;
        filter: drop-shadow(0 14px 18px #e8a0bf55);
      }
      .flame {
        position: absolute;
        left: 50%;
        top: 15.5%;
        width: 20px;
        height: 34px;
        margin-left: -10px;
        transform-origin: 50% 100%;
        transform: scale(var(--s, 1));
        transition:
          transform 0.45s,
          opacity 0.5s;
        animation: flick 0.18s infinite alternate;
        filter: drop-shadow(0 0 12px #ffd27a);
      }
      .flame:before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50% 50% 50% 50%/65% 65% 35% 35%;
        background: radial-gradient(
          ellipse at 50% 75%,
          #fff6c8 10%,
          #ffd27a 45%,
          #f4a261 100%
        );
      }
      .flame.gust {
        animation: gust 0.45s;
      }
      .flame.out {
        opacity: 0;
        transform: scale(0);
      }
      @keyframes flick {
        from {
          rotate: -4deg;
          scale: 1 1;
        }
        to {
          rotate: 4deg;
          scale: 0.94 1.06;
        }
      }
      @keyframes gust {
        30% {
          rotate: -26deg;
          scale: 0.8 1;
        }
        65% {
          rotate: 20deg;
        }
      }
      .puff,
      .smoke {
        position: absolute;
        left: 50%;
        top: 14%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
        animation: puff 1.4s ease-out forwards;
      }
      .puff {
        background: radial-gradient(#fff, #fff8);
      }
      .smoke {
        background: radial-gradient(#cbb5c0aa, #cbb5c000 70%);
        width: 22px;
        height: 22px;
        animation-duration: 2.4s;
      }
      @keyframes puff {
        0% {
          opacity: 0.9;
          transform: translate(0, 0) scale(0.4);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx, 20px), -90px) scale(2.2);
        }
      }
      #msg {
        min-height: 84px;
        margin: 14px 0;
      }
      #msg h2 {
        animation: fade 0.8s;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .hint {
        font-size: 13px;
        opacity: 0.8;
      }
      .keycap {
        display: inline-block;
        border: 1px solid var(--acc);
        border-bottom-width: 3px;
        border-radius: 6px;
        padding: 0 8px;
        background: #fff;
      }
      .sp {
        position: absolute;
        color: var(--gold);
        animation: tw 2.6s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes tw {
        50% {
          opacity: 0.15;
          transform: scale(0.6);
        }
      }
      /* envelopes */
      .egrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
        max-width: 820px;
        margin: 28px auto;
      }
      .env {
        position: relative;
        aspect-ratio: 1.45;
        animation: bob 5s ease-in-out infinite;
        transition: transform 0.3s;
        perspective: 600px;
      }
      .env:nth-child(2) {
        animation-delay: -1.2s;
      }
      .env:nth-child(3) {
        animation-delay: -2.4s;
      }
      .env:nth-child(4) {
        animation-delay: -3.6s;
      }
      @keyframes bob {
        50% {
          translate: 0 -7px;
        }
      }
      .env:hover {
        transform: rotate(-2deg) translateY(-6px);
      }
      .env .body {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background: linear-gradient(145deg, #fff, var(--pink));
        border: 1px solid #fff;
        box-shadow: 0 10px 24px #e8a0bf55;
      }
      .env .body:before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background:
          linear-gradient(
            to top right,
            transparent 49.5%,
            #e8a0bf44 50%,
            transparent 51%
          ),
          linear-gradient(
            to top left,
            transparent 49.5%,
            #e8a0bf44 50%,
            transparent 51%
          );
      }
      .env .flap {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 55%;
        background: linear-gradient(#fbd9e6, var(--acc));
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        border-radius: 10px 10px 0 0;
        transform-origin: top;
        transition: transform 0.6s;
        z-index: 2;
      }
      .env.open .flap {
        transform: rotateX(180deg);
        z-index: 0;
      }
      .env.open {
        transform: scale(1.08);
      }
      .seal {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34px;
        height: 34px;
        margin: -17px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f2b6cf, #c9718f);
        color: #fff;
        z-index: 3;
        display: grid;
        place-items: center;
        box-shadow: 0 2px 6px #70465a55;
        transition: 0.3s;
      }
      .env.open .seal {
        opacity: 0;
      }
      .env .cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8px;
        z-index: 3;
        font-size: 11px;
        line-height: 1.25;
        padding: 0 8px;
      }
      .env .cap b {
        display: block;
        font:
          600 17px "Cormorant Garamond",
          serif;
      }
      .env .num {
        color: var(--acc);
        letter-spacing: 0.2em;
        font-size: 10px;
      }
      .env .done {
        position: absolute;
        top: -8px;
        right: -6px;
        z-index: 4;
        background: var(--gold);
        color: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 12px;
        display: grid;
        place-items: center;
      }
      .prog {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .prog i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1.5px solid var(--acc);
        transition: 0.4s;
      }
      .prog i.on {
        background: var(--acc);
      }
      .final {
        margin: 20px auto;
        max-width: 480px;
        padding: 18px;
        border-radius: 16px;
        background: #fff;
        border: 1px dashed var(--gold);
        animation: fade 1s;
      }
      /* viewer */
      .top {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
        background: #fff0f5ee;
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--pink);
      }
      .bot {
        position: sticky;
        bottom: 0;
        z-index: 5;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
        background: #fff0f5ee;
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border-top: 1px solid var(--pink);
      }
      .bot .btn {
        padding: 9px 14px;
        font-size: 13px;
      }
      .top small {
        font-size: 12px;
      }
      .vwrap {
        min-height: calc(100vh - 140px);
      }
      .vhead {
        margin: 10px 0 22px;
      }
      .vhead h2 {
        font-size: clamp(28px, 6vw, 42px);
      }
      .vhead p {
        margin: 4px 0;
        font-style: italic;
        font-family: "Cormorant Garamond", serif;
        font-size: 18px;
      }
      .scrap {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
      }
      .pol {
        flex: var(--a, 1) 1 calc(var(--a, 1) * 230px);
        min-width: min(100%, 170px);
        margin: 0;
        background: #fff;
        padding: 10px 10px 12px;
        border-radius: 4px;
        box-shadow: 0 8px 20px #70465a22;
        cursor: zoom-in;
        transition: 0.3s;
        animation: pop 0.6s backwards;
        rotate: var(--r, 0deg);
      }
      .pol:hover {
        rotate: 0deg;
        transform: translateY(-4px);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.96);
        }
      }
      .ph {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, var(--soft), var(--pink));
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 30px;
        aspect-ratio: var(--a, 1);
      }
      .ph img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pol p,
      .tcard p {
        margin: 8px 2px 0;
        font:
          italic 500 17px "Cormorant Garamond",
          serif;
        line-height: 1.3;
      }
      .notes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px;
      }
      .note {
        min-height: 170px;
        perspective: 800px;
        animation: pop 0.6s backwards;
      }
      .note > div {
        display: grid;
        width: 100%;
        height: 100%;
        transition: transform 0.7s;
        transform-style: preserve-3d;
      }
      .note.f > div {
        transform: rotateY(180deg);
      }
      .note .a,
      .note .b {
        grid-area: 1/1;
        backface-visibility: hidden;
        text-align: center;
        border-radius: 12px;
        padding: 16px;
        display: grid;
        place-items: center;
        box-shadow: 0 6px 16px #e8a0bf44;
        border: 1px solid var(--pink);
      }
      .note .a {
        position: relative;
        background: repeating-linear-gradient(#fff 0 27px, #fadadd 27px 28px);
        font:
          600 22px "Cormorant Garamond",
          serif;
      }
      .note .a:after {
        content: "♡";
        position: absolute;
        bottom: 8px;
        right: 12px;
        color: var(--acc);
        font-size: 14px;
      }
      .note .b {
        background: linear-gradient(#fff, var(--soft));
        transform: rotateY(180deg);
        font:
          italic 500 18px/1.35 "Cormorant Garamond",
          serif;
      }
      .tl {
        position: relative;
        max-width: 1100px;
        margin: auto;
        text-align: left;
      }
      .tl:before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        border-left: 2px dotted var(--acc);
      }
      .trow {
        position: relative;
        width: 50%;
        padding: 0 28px 28px 0;
        animation: pop 0.7s backwards;
      }
      .trow:nth-child(even) {
        margin-left: 50%;
        padding: 0 0 28px 28px;
      }
      .trow:after {
        content: "♥";
        position: absolute;
        right: -9px;
        top: 14px;
        color: var(--acc);
        font-size: 16px;
        background: var(--bg);
        line-height: 1;
      }
      .trow:nth-child(even):after {
        right: auto;
        left: -9px;
      }
      .tcard {
        background: #fff;
        border-radius: 14px;
        padding: 10px;
        box-shadow: 0 8px 20px #70465a1f;
        border: 1px solid var(--pink);
      }
      .tcard .d {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        margin-top: 8px;
      }
      .tcard .ph {
        border-radius: 8px;
        aspect-ratio: var(--a, 1.33);
        max-height: 440px;
      }
      .paper {
        max-width: 780px;
        margin: 0 auto;
        text-align: left;
        padding: clamp(24px, 6vw, 54px);
        border-radius: 6px;
        background: radial-gradient(#fff 0, #fff7fa 70%), #fff;
        box-shadow:
          0 14px 40px #70465a26,
          inset 0 0 60px #f8c8dc66;
        border: 1px solid #fff;
        font:
          500 19px/1.8 "Cormorant Garamond",
          serif;
      }
      .paper h3 {
        font-size: 30px;
        text-align: center;
        margin-bottom: 18px;
      }
      .paper p {
        margin: 0 0 1em;
      }
      .sig {
        font:
          400 38px "Great Vibes",
          cursive;
        text-align: right;
        color: var(--acc);
        margin-top: 20px;
      }
      .lb {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #70465ae6;
        display: grid;
        place-items: center;
        padding: 16px;
        animation: fade 0.3s;
      }
      .lb figure {
        margin: 0;
        background: #fff;
        padding: 12px 12px 14px;
        max-width: min(92vw, 560px);
        text-align: center;
        border-radius: 4px;
      }
      .lb .ph {
        width: min(80vw, 520px);
        height: min(62vh, calc(min(80vw, 520px) / var(--a, 1)));
      }
      .lb .ph img {
        object-fit: contain;
      }
      .lb .nv {
        position: absolute;
        top: 50%;
        color: #fff;
        font-size: 38px;
        padding: 12px;
      }
      .lb .x {
        position: absolute;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: 18px;
        color: #fff;
        font-size: 30px;
      }
      #music {
        position: fixed;
        right: 12px;
        top: calc(60px + env(safe-area-inset-top, 0px));
        z-index: 9;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid var(--pink);
        box-shadow: 0 3px 10px #e8a0bf44;
        font-size: 16px;
      }
      #music.on {
        background: var(--pink);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 90px;
        translate: -50% 0;
        background: var(--ink);
        color: #fff;
        font-size: 12px;
        padding: 8px 14px;
        border-radius: 999px;
        z-index: 30;
        opacity: 0;
        transition: 0.4s;
        pointer-events: none;
      }
      #toast.s {
        opacity: 1;
      }
      canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 15;
      }
      button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .dim {
        position: fixed;
        inset: 0;
        z-index: 12;
        background: #70465ad9;
        display: grid;
        place-items: center;
        text-align: center;
        color: #fff;
        padding: 24px;
        transition: opacity 0.8s;
      }
      .dim.gone {
        opacity: 0;
      }
      .dim h2 {
        font-size: clamp(30px, 8vw, 52px);
        animation: fade 1.2s backwards;
      }
      .dim p {
        font:
          italic 500 clamp(18px, 4.5vw, 24px) "Cormorant Garamond",
          serif;
        opacity: 0;
        animation: fin 1s 2.2s forwards;
      }
      @keyframes fin {
        to {
          opacity: 1;
        }
      }
      .env.secret {
        grid-column: 1/-1;
        width: min(300px, 70%);
        margin: 6px auto 0;
        animation:
          bob 5s ease-in-out infinite,
          glow 3s ease-in-out infinite;
      }
      .env.secret .body {
        background: linear-gradient(145deg, #fffaf0, #f6d7b8 50%, var(--pink));
        box-shadow:
          0 0 28px #d8b878aa,
          0 10px 24px #e8a0bf55;
      }
      .env.secret .flap {
        background: linear-gradient(#f8e2c8, var(--gold));
      }
      .env.fresh {
        animation:
          reveal 1.4s backwards,
          bob 5s 1.4s ease-in-out infinite,
          glow 3s 1.4s ease-in-out infinite;
      }
      @keyframes reveal {
        from {
          opacity: 0;
          transform: scale(0.5) translateY(40px);
        }
      }
      @keyframes glow {
        50% {
          filter: drop-shadow(0 0 14px #d8b878);
        }
      }
      .paper.ivory {
        background: linear-gradient(160deg, #fffdf7, #fff1ec);
        border: 1px solid #f3dcc8;
        box-shadow:
          0 14px 40px #70465a26,
          inset 0 0 70px #f8c8dc88;
      }
      .paper.unfold {
        transform-origin: top;
        animation: unfold 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }
      @keyframes unfold {
        from {
          opacity: 0;
          transform: scaleY(0.15) translateY(-20px);
        }
      }
      @media (max-width: 340px) {
        .egrid {
          grid-template-columns: 1fr;
          max-width: 260px;
        }
        .env.secret {
          width: 100%;
        }
      }
      @media (max-width: 560px) {
        .egrid {
          gap: 14px;
        }
        .env .cap b {
          font-size: 14px;
        }
        .env .cap span {
          display: none;
        }
        .trow,
        .trow:nth-child(even) {
          width: 100%;
          margin: 0;
          padding: 0 0 22px 30px;
        }
        .tl:before {
          left: 8px;
        }
        .trow:after,
        .trow:nth-child(even):after {
          left: 0;
          right: auto;
        }
        .scrap {
          gap: 12px;
        }
        .pol {
          flex-basis: calc(var(--a, 1) * 120px);
          min-width: 130px;
        }
        .top small {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" id="bg"></div>
    <button id="music" title="Music" aria-label="Toggle music">♪</button>
    <div id="view"></div>
    <div id="toast"></div>
    <canvas id="cv"></canvas>
    <script>
      /* ===========================================================
   EDIT EVERYTHING HERE. (In the Vite version this is src/data/birthdayContent.js)
   Photos: put files in public/images/ and use "images/yourfile.jpg".
   Leave src as "" to show a pink placeholder. "a" = aspect ratio (1 square, .8 tall, 1.3 wide).
   Music: put a file in public/music/ and set music: "music/song.mp3" (never autoplays).

            "I want you to know, that I'm never giving up on you. I'll fight for you. Every breathing second. You'll never need to worry. And I mean, never. You'll be taken care of like a queen. A queen in her throne, like she deserves to be in",
            "Because you, just turn everyone's lives around. Anyone that you know, having a bad day, just starts smiling. Without you even trying. You don't even realise it. Your mere presence, by itself, is healing. It's healed me from stuff I didn't know I'd recover from.",
            "I know we've only been in a relationship for a month, and it feels like I've known you my entire life. And at the same time, missed you my entire life. I don't even know how to explain it. Your eyes, your words, your character, and everything that makes you, you, is something that I CHERISH, AND WILL CHERISH FOR THE REST OF MY LIFE",
            "You're imperfectly perfect, and most of all, you're mine. I've given you every part of my heart and soul. I completely surrender to you, milady. Happy birthday",
            "I love you the most. Nothing can even compare.",
          ],
          photo: { src: IMG.fav, cap: "En pondatti 😎😎", a: 2.222 },
          ending:
            "Happy Birthday, my Amirtha. I hope you know how much you mean to me. And my love for you. ♡",
          signature: "Yours, always",
        },
      };
      /* ====================== app ====================== */
      const $ = (s) => document.querySelector(s),
        V = $("#view");
      const KEY = "ami-birthday-v1";
      let saved = {};
      try {
        saved = JSON.parse(localStorage.getItem(KEY) || "{}");
      } catch (e) {}
      const S = {
        opened: new Set(saved.o || []),
        cur: 0,
        lb: -1,
        presses: 0,
        out: false,
        music: false,
        unlocked: !!saved.u,
        fresh: false,
      };
      const save = () => {
        try {
          localStorage.setItem(
            KEY,
            JSON.stringify({ o: [...S.opened], u: S.unlocked }),
          );
        } catch (e) {}
      };
      const n4 = () => [0, 1, 2, 3].filter((i) => S.opened.has(i)).length,
        N = () => (S.unlocked ? 5 : 4);
      const envList = () =>
        S.unlocked
          ? [...C.envelopes, { title: C.secret.title, sub: C.secret.sub }]
          : C.envelopes;
      const nav = (j) =>
        go(() => (n4() == 4 && !S.unlocked ? envelopes() : viewer(j)));
      function reveal() {
        if (document.querySelector(".dim")) return;
        const o = document.createElement("div");
        o.className = "dim";
        o.innerHTML =
          "<div><h2>Wait... there’s something else.</h2><p>You thought that was everything? Not quite, sweetheart. ♡</p></div>";
        document.body.appendChild(o);
        setTimeout(() => {
          S.unlocked = true;
          S.fresh = true;
          save();
          envelopes();
          S.fresh = false;
          o.classList.add("gone");
          confetti(90);
          setTimeout(() => o.remove(), 900);
        }, 5200);
      }
      const ENV = [{ i: 0 }, { i: 1 }, { i: 2 }, { i: 3 }];
      /* ambient hearts */
      $("#bg").innerHTML = Array.from(
        { length: 9 },
        (_, i) =>
          `<i style="left:${(i * 11 + Math.random() * 8) | 0}%;font-size:${(12 + Math.random() * 12) | 0}px;animation-duration:${(16 + Math.random() * 12) | 0}s;animation-delay:-${(Math.random() * 20) | 0}s">♡</i>`,
      ).join("");
      const sparkles = (n) =>
        Array.from(
          { length: n },
          () =>
            `<span class="sp" style="left:${(Math.random() * 92) | 0}%;top:${(Math.random() * 85) | 0}%;font-size:${(10 + Math.random() * 10) | 0}px;animation-delay:-${Math.random() * 3}s">✦</span>`,
        ).join("");
      const ph = (o, cls = "") =>
        `<div class="ph ${cls}" style="--a:${o.a || 1}">♡${o.src ? `<img src="${o.src}" alt="${o.cap || ""}" onerror="this.remove()">` : ""}</div>`;
      function go(fn) {
        V.classList.add("out");
        setTimeout(() => {
          fn();
          window.scrollTo(0, 0);
          V.classList.remove("out");
        }, 330);
      }
      function toast(t) {
        const e = $("#toast");
        e.textContent = t;
        e.classList.add("s");
        setTimeout(() => e.classList.remove("s"), 2600);
      }
      /* confetti */
      const cv = $("#cv"),
        cx = cv.getContext("2d");
      let P = [],
        raf;
      function confetti(n = 140) {
        cv.width = innerWidth;
        cv.height = innerHeight;
        const col = ["#F8C8DC", "#E8A0BF", "#D8B878", "#FADADD", "#fff"];
        for (let i = 0; i < n; i++)
          P.push({
            x: innerWidth / 2,
            y: innerHeight * 0.45,
            vx: (Math.random() - 0.5) * 14,
            vy: -Math.random() * 13 - 3,
            s: 4 + Math.random() * 6,
            c: col[i % 5],
            r: Math.random() * 6,
            w: (Math.random() - 0.5) * 0.3,
            h: Math.random() < 0.3,
          });
        cancelAnimationFrame(raf);
        (function f() {
          cx.clearRect(0, 0, cv.width, cv.height);
          P = P.filter((p) => p.y < cv.height + 20);
          P.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.28;
            p.vx *= 0.99;
            p.r += p.w;
            cx.save();
            cx.translate(p.x, p.y);
            cx.rotate(p.r);
            cx.fillStyle = p.c;
            p.h
              ? ((cx.font = p.s * 3 + "px serif"), cx.fillText("♥", 0, 0))
              : cx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6);
            cx.restore();
          });
          P.length
            ? (raf = requestAnimationFrame(f))
            : cx.clearRect(0, 0, cv.width, cv.height);
        })();
      }
      /* music */
      const MK = "ami-music-pos";
      let aud;
      function mk() {
        if (aud) return aud;
        aud = new Audio(C.music);
        aud.loop = true;
        aud.preload = "auto";
        let t = 0;
        try {
          t = parseFloat(localStorage.getItem(MK)) || 0;
        } catch (e) {}
        aud.addEventListener(
          "loadedmetadata",
          () => {
            if (t > 0 && t < aud.duration - 1) aud.currentTime = t;
          },
          { once: true },
        );
        let last = 0;
        aud.addEventListener("timeupdate", () => {
          const n = Date.now();
          if (n - last > 1500) {
            last = n;
            try {
              localStorage.setItem(MK, aud.currentTime);
            } catch (e) {}
          }
        });
        aud.addEventListener("pause", () => {
          try {
            localStorage.setItem(MK, aud.currentTime);
          } catch (e) {}
        });
        aud.addEventListener("ended", () => {
          aud.currentTime = 0;
          aud.play().catch(() => {});
        });
        aud.addEventListener("error", () => {
          S.music = false;
          $("#music").classList.remove("on");
          toast("Could not load the music file");
        });
        return aud;
      }
      addEventListener("pagehide", () => {
        if (aud)
          try {
            localStorage.setItem(MK, aud.currentTime);
          } catch (e) {}
      });
      $("#music").onclick = () => {
        if (!C.music)
          return toast("Add an audio file in C.music to enable music ♡");
        const a = mk();
        S.music = !S.music;
        if (S.music)
          a.play().catch(() => {
            S.music = false;
            $("#music").classList.remove("on");
            toast("Could not play audio");
          });
        else a.pause();
        $("#music").classList.toggle("on", S.music);
      };
      /* ---------- scene 1: cake ---------- */
      const cakeSVG = `<svg viewBox="0 0 300 300"><ellipse cx="150" cy="268" rx="130" ry="16" fill="#fff" stroke="#F8C8DC"/><rect x="40" y="190" width="220" height="76" rx="14" fill="#F8C8DC"/><rect x="40" y="190" width="220" height="14" fill="#fff" opacity=".6"/>
<path d="M40 196h220v14c-10 14-18 0-28 12s-20 0-30 8-20-6-30 6-20-4-30 4-20-6-30 6-20-4-30 6-14 0-22-6z" fill="#fff"/>
<rect x="78" y="132" width="144" height="62" rx="12" fill="#FADADD"/><path d="M78 140h144v10c-10 12-18-2-28 8s-20-2-30 6-20-6-30 4-20-2-30 6-18-4-26-6z" fill="#fff"/>
<g fill="#D8B878"><circle cx="70" cy="238" r="4"/><circle cx="110" cy="246" r="4"/><circle cx="150" cy="240" r="4"/><circle cx="190" cy="246" r="4"/><circle cx="230" cy="238" r="4"/></g>
<g fill="#E8A0BF"><circle cx="98" cy="176" r="5"/><circle cx="150" cy="180" r="5"/><circle cx="202" cy="176" r="5"/></g>
<rect x="144" y="96" width="12" height="38" rx="3" fill="#fff" stroke="#E8A0BF"/><path d="M144 108l12-6M144 118l12-6M144 128l12-6" stroke="#E8A0BF" stroke-width="3"/><path d="M150 96v-6" stroke="#70465A" stroke-width="2"/></svg>`;
      function cake() {
        S.presses = 0;
        S.out = false;
        V.innerHTML = `<div class="screen" style="position:relative;padding-top:6vh">${sparkles(10)}<div id="msg"><h1 style="font-size:clamp(34px,8vw,58px)">Happy Birthday, My Love ♡</h1><p>I made something special for you...</p></div>
 <div id="cake">${cakeSVG}<div class="flame" id="fl"></div></div>
 <p class="hint" id="hint" style="margin-top:22px">Take a deep breath and blow out your candle!<br>Press <span class="keycap">SPACE</span> to make a wish.</p>
 <button class="btn big" id="blow" style="margin-top:12px">Blow ♡</button></div>`;
        $("#blow").onclick = press;
      }
      function press() {
        if (S.out || $("#fl") == null) return;
        S.presses++;
        const f = $("#fl"),
          c = $("#cake");
        f.classList.remove("gust");
        void f.offsetWidth;
        f.classList.add("gust");
        f.style.setProperty("--s", Math.max(0.35, 1 - S.presses * 0.11));
        for (let i = 0; i < 3; i++) {
          const p = document.createElement("div");
          p.className = "puff";
          p.style.setProperty("--dx", (i - 1) * 26 + "px");
          p.style.animationDelay = i * 0.08 + "s";
          c.appendChild(p);
          setTimeout(() => p.remove(), 1700);
        }
        if (S.presses >= 6) snuff();
      }
      function snuff() {
        S.out = true;
        const f = $("#fl"),
          c = $("#cake");
        setTimeout(() => f.classList.add("out"), 350);
        for (let i = 0; i < 4; i++) {
          const s = document.createElement("div");
          s.className = "smoke";
          s.style.setProperty("--dx", (i % 2 ? 18 : -18) + "px");
          s.style.animationDelay = 0.4 + i * 0.35 + "s";
          c.appendChild(s);
          setTimeout(() => s.remove(), 3600);
        }
        setTimeout(() => {
          confetti();
          $("#hint").style.visibility = "hidden";
          $("#blow").style.display = "none";
          $("#msg").innerHTML =
            '<h2 style="font-size:clamp(28px,6vw,44px)">Your wish has been made. ♡</h2>';
          setTimeout(
            () =>
              ($("#msg").innerHTML +=
                '<p style="animation:fade 1s">But wait... I have a few more things for you.</p>'),
            1500,
          );
          setTimeout(() => go(envelopes), 4600);
        }, 900);
      }
      addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.key === " ") {
          if ($("#fl")) {
            e.preventDefault();
            if (!e.repeat) press();
          }
        }
      });
      /* ---------- scene 2: envelopes ---------- */
      function envelopes() {
        S.lb = -1;
        const n = n4();
        if (n === 4 && !S.unlocked) return reveal();
        V.innerHTML = `<div class="screen"><div class="eyebrow" id="rs">for ${C.name}</div><h1 style="font-size:clamp(30px,7vw,50px)">Four Little Pieces of My Heart</h1><p>I have something for you in each of these. Open them one by one, sweetheart. ♡</p>
 <div class="egrid">${envList()
   .map(
     (e, i) =>
       `<button class="env${i == 4 ? " secret" + (S.fresh ? " fresh" : "") : ""}" data-i="${i}" aria-label="Open ${e.title}"><div class="body"></div><div class="flap"></div><div class="seal">♥</div>${S.opened.has(i) ? '<span class="done">✓</span>' : ""}<div class="cap"><span class="num">0${i + 1}</span><b>${e.title}</b><span>${e.sub}</span></div></button>`,
   )
   .join("")}</div>
 <div class="prog">${[0, 1, 2, 3].map((i) => `<i class="${S.opened.has(i) ? "on" : ""}"></i>`).join("")}<small>${n} of 4 opened</small></div>
 
 <p style="margin-top:22px"><button class="btn" id="replay">↺ Back to the cake</button></p></div>`;
        V.querySelectorAll(".env").forEach(
          (b) =>
            (b.onclick = () => {
              b.classList.add("open");
              setTimeout(() => go(() => viewer(+b.dataset.i)), 650);
            }),
        );
        $("#replay").onclick = () => go(cake);
        let c = 0,
          t;
        $("#rs").onclick = () => {
          c++;
          clearTimeout(t);
          t = setTimeout(() => (c = 0), 700);
          if (c >= 3) {
            S.opened.clear();
            S.unlocked = false;
            save();
            go(envelopes);
          }
        };
      }
      /* ---------- scene 3: viewer ---------- */
      function viewer(i) {
        S.cur = i;
        S.opened.add(i);
        save();
        const e = i == 4 ? C.secret : C.envelopes[i];
        let body = "";
        if (i == 0)
          body = `<div class="scrap">${C.memories.map((m, k) => `<figure class="pol" data-k="${k}" style="--a:${m.a || 1};--r:${((k % 3) - 1) * 1.6}deg;animation-delay:${k * 0.1}s;margin:0 0 20px">${ph(m)}<p>${m.cap}</p></figure>`).join("")}</div>`;
        if (i == 1)
          body = `<div class="notes">${C.notes.map((n, k) => `<div class="note" tabindex="0" style="animation-delay:${k * 0.07}s"><div><div class="a">${n.t}</div><div class="b" style="font-size:${n.m.length > 230 ? 15 : n.m.length > 150 ? 16.5 : 18}px">${n.m}</div></div></div>`).join("")}</div><p class="hint" style="margin-top:22px">Tap a card to turn it over.</p>`;
        if (i == 2)
          body = `<div class="tl">${C.timeline.map((t, k) => `<div class="trow" style="animation-delay:${k * 0.12}s"><div class="tcard">${ph(t)}<div class="d">${t.date}</div><p>${t.cap}</p></div></div>`).join("")}</div>`;
        if (i == 3)
          body = `<div class="paper"><h3>${C.letterTitle}</h3>${C.letter.map((p) => `<p>${p}</p>`).join("")}<div class="sig">${C.signature}</div><div id="end" style="height:1px"></div></div>`;
        if (i == 4) {
          const s = C.secret;
          body = `<div class="paper ivory unfold"><h3>${s.letterTitle}</h3>${s.letter.map((p) => `<p>${p}</p>`).join("")}${s.photo ? `<div style="margin:26px auto;max-width:320px;background:#fff;padding:10px 10px 12px;rotate:-1deg;box-shadow:0 8px 20px #70465a22">${ph(s.photo)}<p style="margin:8px 2px 0;text-align:center;font-size:17px;line-height:1.3">${s.photo.cap}</p></div>` : ""}<p style="text-align:center;font-style:italic">${s.ending}</p><div class="sig">${s.signature}</div><div id="end" style="height:1px"></div></div>`;
        }
        V.innerHTML = `<div class="top"><button class="btn" id="home" style="padding:8px 14px;font-size:13px">← Back to Envelopes</button><div class="prog">${Array.from(
          { length: N() },
          (_, k) => k,
        )
          .map((k) => `<i class="${k == i ? "on" : ""}"></i>`)
          .join(
            "",
          )}<small>${i == 4 ? "The hidden letter" : `Envelope ${i + 1} of 4`}</small></div><button class="btn" id="cakeb" style="padding:8px 12px;font-size:13px" title="Back to the cake">🎂︎</button></div>
 <div class="screen vwrap"><div class="vhead"><div class="eyebrow">${i == 4 ? "a secret" : "0" + (i + 1)}</div><h2>${e.title}</h2><p>${e.sub}</p></div>${body}</div>
 <div class="bot"><button class="btn" id="prev">← ${envList()[(i + N() - 1) % N()].title.split(" ").slice(0, 2).join(" ")}</button><button class="btn" id="all">${n4()}/4 opened</button><button class="btn" id="next">${envList()[(i + 1) % N()].title.split(" ").slice(0, 2).join(" ")} →</button></div>`;
        $("#home").onclick = $("#all").onclick = () => go(envelopes);
        $("#cakeb").onclick = () => go(cake);
        $("#prev").onclick = () => nav((i + N() - 1) % N());
        $("#next").onclick = () => nav((i + 1) % N());
        V.querySelectorAll(".pol").forEach(
          (p) => (p.onclick = () => lightbox(+p.dataset.k)),
        );
        V.querySelectorAll(".note").forEach((n) => {
          n.onclick = () => n.classList.toggle("f");
          n.onkeydown = (ev) => {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              n.classList.toggle("f");
            }
          };
        });
        if (i >= 3) {
          const o = new IntersectionObserver(
            (en) => {
              if (en[0].isIntersecting) {
                o.disconnect();
                confetti(40);
              }
            },
            { threshold: 1 },
          );
          o.observe($("#end"));
        }
      }
      /* lightbox */
      function lightbox(k) {
        const m = C.memories,
          n = m.length;
        k = (k + n) % n;
        S.lb = k;
        let L = $(".lb");
        if (!L) {
          L = document.createElement("div");
          L.className = "lb";
          document.body.appendChild(L);
        }
        L.innerHTML = `<button class="x" aria-label="Close">×</button><button class="nv" style="left:4px" aria-label="Previous">‹</button><figure>${ph(m[k])}<p style="font:italic 500 20px 'Cormorant Garamond',serif;margin:10px 0 0">${m[k].cap}</p></figure><button class="nv" style="right:4px" aria-label="Next">›</button>`;
        const b = L.querySelectorAll("button");
        b[0].onclick = () => {
          L.remove();
          S.lb = -1;
        };
        b[1].onclick = () => lightbox(k - 1);
        b[2].onclick = () => lightbox(k + 1);
      }
      addEventListener("keydown", (e) => {
        if (S.lb < 0) return;
        if (e.key === "ArrowLeft") lightbox(S.lb - 1);
        if (e.key === "ArrowRight") lightbox(S.lb + 1);
        if (e.key === "Escape") {
          $(".lb")?.remove();
          S.lb = -1;
        }
      });
      cake();
    </script>
  </body>
</html>
